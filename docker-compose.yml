version: '3.8'

services:
  db:
    image: postgres
    ports:
      - ${DATABASE_PORT:-5432}:5432
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD?:}
      - POSTGRES_USER=${DATABASE_USER?:}
      - POSTGRES_DB=${DATABASE_NAME?:}
    command: ["postgres"]
    volumes: []
    networks: []

  backend:
    image: rijksoverheid-backend
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${DATABASE_PORT:-5432}/${DATABASE_NAME?:}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USER?:}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD?:}
    ports:
      - ${BACKEND_PORT?:-8081}:8081

  frontend:
    image: rijksoverheid-frontend
    build:
      context: ./frontend
    ports:
      - ${FRONTEND_REACT_PORT:?}:80
    environment:
      - REACT_APP_BACKEND_PORT=${BACKEND_PORT?:-8081}