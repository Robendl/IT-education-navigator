name: Build Checks
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:

      - name: "checkout repository"
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: "setup java"
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: "cache dependencies"
        uses: actions/cache@v2
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-backend-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: "add executable permission to gradlew script"
        run: chmod +x ./gradlew
        working-directory: ./backend

      - name: "build backend"
        run: ./gradlew :bootJar
        working-directory: ./backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v2

      - name: "setup node"
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: "cache dependencies"
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: "install dependencies"
        run: npm install
        working-directory: ./frontend

      - name: "build frontend"
        run: npm run build
        working-directory: ./frontend